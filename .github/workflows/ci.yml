name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,app]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  bundle:
    # Needs workspace credentials; skipped until the DATABRICKS_TOKEN secret is set.
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: https://dbc-771eb7e2-bf8c.cloud.databricks.com
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.18.0
        if: env.DATABRICKS_TOKEN != ''
      - name: Validate bundle
        if: env.DATABRICKS_TOKEN != ''
        run: databricks bundle validate
      - name: Skip note
        if: env.DATABRICKS_TOKEN == ''
        run: echo "DATABRICKS_TOKEN secret not set; bundle validation skipped."
