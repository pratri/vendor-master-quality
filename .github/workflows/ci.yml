name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,app]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  bundle:
    # Needs workspace credentials; skipped until DATABRICKS_HOST and DATABRICKS_TOKEN secrets exist.
    runs-on: ubuntu-24.04
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: databricks/setup-cli@v1.18.0
        if: env.DATABRICKS_TOKEN != ''
      - name: Validate bundle
        if: env.DATABRICKS_TOKEN != ''
        run: databricks bundle validate
      - name: Skip note
        if: env.DATABRICKS_TOKEN == ''
        run: echo "DATABRICKS_TOKEN secret not set; bundle validation skipped."
