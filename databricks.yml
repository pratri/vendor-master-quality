bundle:
  name: vendor_master_quality

include:
  - jobs/*.yml
  - pipelines/*.yml
  - dashboards/*.yml

variables:
  catalog:
    default: workspace
  schema:
    default: vendor_mdq
  initial_load_date:
    description: First extract_date; its snapshot is the SCD2 baseline. Must equal the generator start.
    default: "2026-09-01"
  warehouse_id:
    description: SQL warehouse for the AI/BI dashboard, looked up by name.
    lookup:
      warehouse: Serverless Starter Warehouse

# The workspace comes from your CLI profile (databricks auth login) or DATABRICKS_HOST,
# so the bundle is not tied to one workspace.

resources:
  schemas:
    vendor_mdq:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: Vendor master data quality pipeline

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.vendor_mdq.name}
      name: landing
      volume_type: MANAGED
      comment: Daily SAP-shaped extracts from the generator

targets:
  dev:
    mode: development
    default: true
